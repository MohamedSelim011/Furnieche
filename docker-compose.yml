# Local development: `docker compose up -d contract-service`
# The Next.js app itself still runs with `npm run dev`.
services:
  contract-service:
    build: ./contract-service
    env_file: ./contract-service/.env
    ports:
      - "8000:8000"
    extra_hosts:
      # Lets the container reach `npm run dev` on the host (Linux needs this; Docker Desktop has it built in)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
